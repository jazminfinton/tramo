rules:
  proposal:
    - Confirm scope explicitly — greenfield project, no existing code or specs to preserve
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Confirm final stack choices (Next.js App Router, React, TypeScript, Tailwind CSS, pnpm) before locking architecture
    - Document architecture decisions with rationale
    - Include sequence diagrams for complex flows
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
    - First task batch MUST set up the test runner (e.g., Vitest, Playwright) before any feature code
  apply:
    - Follow existing code patterns once established; the first batch establishes scaffolding conventions
    - Strict TDD Mode is ACTIVE — follow RED-GREEN-REFACTOR once the test runner exists
    - Set up the test runner FIRST if it does not exist yet
    tdd: true
    test_command: ""
  verify:
    test_command: ""
    build_command: ""
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
